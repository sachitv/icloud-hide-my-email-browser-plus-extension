# SonarQube Cloud automatic analysis configuration.
#
# Sonar never runs duplication detection (CPD) on code declared as tests via
# `sonar.tests`. Automatic analysis does not support `sonar.tests`, so every
# file under tests/ is scanned as production source and its shared arrange /
# act scaffolding is reported as duplication. `sonar.cpd.exclusions` is the
# supported way to express the same intent here.
#
# Duplication detection stays enabled for all production code.
sonar.cpd.exclusions=tests/**
